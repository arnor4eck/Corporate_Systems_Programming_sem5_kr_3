# Isolated acceptance environment; does not mount the application's postgres_data volume.
services:
  backend:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/kr3_verify
      DB_USERNAME: kr3_verify
      DB_PASSWORD: ${KR3_VERIFY_DB_PASSWORD:?Required}
      ADMIN_LOGIN: verify-admin
      ADMIN_PASSWORD: ${KR3_VERIFY_ADMIN_PASSWORD:?Required}
      JWT_SECRET: ${KR3_VERIFY_JWT_SECRET:?Required}
    ports:
      - "127.0.0.1:18081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: kr3_verify
      POSTGRES_USER: kr3_verify
      POSTGRES_PASSWORD: ${KR3_VERIFY_DB_PASSWORD:?Required}
    volumes:
      - verify_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kr3_verify -d kr3_verify"]
      interval: 5s
      timeout: 5s
      retries: 24
volumes:
  verify_data:

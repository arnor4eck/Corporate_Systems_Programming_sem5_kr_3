spring.application.name=pks_3
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:pks_3}}
spring.datasource.username=${DB_USERNAME:pks_3}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
app.auth.jwt-secret=${JWT_SECRET:}
app.auth.admin-login=${ADMIN_LOGIN:admin}
app.auth.admin-password=${ADMIN_PASSWORD:}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.override-with-generic-response=false
springdoc.paths-to-match=/api/**
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
